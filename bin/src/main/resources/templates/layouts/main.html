<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<title th:text="${pageTitle} ?: 'Category Admin'">Category Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bootstrap CDN (có thể thay bằng file trong /static nếu muốn) -->
<link
	th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}"
	rel="stylesheet" />
<link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">

	<!-- HEADER: ảnh sinh viên + menu -->
	<header th:replace="~{fragments/header :: siteHeader}"></header>

	<!-- NỘI DUNG TRANG CON -->
	<main class="container my-4" layout:fragment="content">
		<!-- Nội dung từng view (list/form) sẽ được inject vào đây -->
	</main>

	<!-- FOOTER: thông tin sinh viên -->
	<footer th:replace="~{fragments/footer :: siteFooter}"></footer>

	<script
		th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/js/app.js}"></script>
</body>
</html>
