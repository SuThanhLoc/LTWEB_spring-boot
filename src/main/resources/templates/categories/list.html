<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/main}">
<body>
	<section layout:fragment="content">

		<div class="d-flex justify-content-between align-items-center mb-3">
			<h1 class="h4 m-0">Danh sách Category</h1>
			<a class="btn btn-primary" th:href="@{/admin/categories/add}">+
				Tạo mới</a>
		</div>

		<div th:if="${successMessage}" class="alert alert-success"
			th:text="${successMessage}"></div>
		<div th:if="${errorMessage}" class="alert alert-danger"
			th:text="${errorMessage}"></div>

		<form class="row g-2 mb-3" method="get"
			th:action="@{/admin/categories}">
			<div class="col-sm-6">
				<input class="form-control" type="text" name="name"
					placeholder="Tìm theo tên..." th:value="${name}">
			</div>
			<div class="col-auto">
				<button class="btn btn-outline-secondary">Tìm</button>
			</div>
			<div class="col-auto">
				<a class="btn btn-outline-dark" th:href="@{/admin/categories}">Xóa
					lọc</a>
			</div>
		</form>

		<div class="table-responsive">
			<table class="table table-striped align-middle">
				<thead class="table-light">
					<tr>
						<th>#</th>
						<th>Tên</th>
						<th>Icons</th>
						<th class="text-end">Thao tác</th>
					</tr>
				</thead>
				<tbody>
					<tr th:if="${page == null or page.empty}">
						<td colspan="4" class="text-center text-muted">Không có dữ
							liệu</td>
					</tr>
					<tr th:each="c, stat : ${page.content}">
						<td th:text="${page.number * page.size + stat.index + 1}">1</td>
						<td th:text="${c.cateName}">Name</td>
						

						<!-- Nếu icons là tên file ảnh trong /uploads -->
						<td><span
							th:if="${c.icons == null or #strings.isEmpty(c.icons)}"
							class="text-muted">—</span> <img
							th:if="${c.icons != null and !#strings.isEmpty(c.icons)}"
							   th:src="@{|/upload/${c.icons}|}" alt="icon" style="height: 32px">
						</td>

						<td class="text-end"><a
							class="btn btn-sm btn-outline-primary"
							th:href="@{|/admin/categories/edit/${c.cateId}|}">Sửa</a>
							<form th:action="@{|/admin/categories/delete/${c.cateId}|}"
								method="post" class="d-inline"
								onsubmit="return confirm('Xóa danh mục này?');">
								<button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
							</form></td>
					</tr>
				</tbody>
			</table>	
		</div>

		<!-- Phân trang -->
		<nav th:if="${page != null and page.totalPages > 1}"
			aria-label="Pagination">
			<ul class="pagination justify-content-center">
				<li class="page-item" th:classappend="${page.first} ? 'disabled'">
					<a class="page-link"
					th:href="@{/admin/categories(page=${page.number-1},size=${page.size},name=${name})}">&laquo;</a>
				</li>
				<li class="page-item"
					th:each="i : ${#numbers.sequence(0, page.totalPages-1)}"
					th:classappend="${i}==${page.number}? 'active'"><a
					class="page-link" th:text="${i+1}"
					th:href="@{/admin/categories(page=${i},size=${page.size},name=${name})}">1</a>
				</li>
				<li class="page-item" th:classappend="${page.last} ? 'disabled'">
					<a class="page-link"
					th:href="@{/admin/categories(page=${page.number+1},size=${page.size},name=${name})}">&raquo;</a>
				</li>
			</ul>
		</nav>

	</section>
</body>
</html>
